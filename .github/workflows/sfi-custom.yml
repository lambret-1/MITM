name: SFI 定制包构建（完整编译）

on:
  push:
    branches: [testSFI]
    paths:
      - '.github/workflows/sfi-custom.yml'
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  GOMOBILE_VERSION: 'v0.1.13'

jobs:
  build:
    name: 构建 SFI 定制包
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 安装依赖
        run: |
          echo "=== 安装 dpkg ldid xcbeautify ==="
          brew install dpkg ldid xcbeautify 2>/dev/null || true
          which dpkg-deb ldid xcbeautify

      - name: 安装 gomobile
        run: |
          echo "=== 安装 gomobile ==="
          go install github.com/sagernet/gomobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          go install github.com/sagernet/gomobile/cmd/gobind@${{ env.GOMOBILE_VERSION }}
          gomobile version || true

      - name: 检出定制 sing-box 内核
        run: |
          echo "=== 检出定制 sing-box 内核（含 MITM 模块）==="
          git clone --depth 1 --branch sing-box https://github.com/lambret-1/MITM.git sing-box-custom
          cd sing-box-custom
          go version
          ls experimental/libbox/

      - name: 编译 Libbox.xcframework
        run: |
          echo "=== 用 gomobile 编译 Libbox.xcframework ==="
          cd sing-box-custom
          export PATH="$HOME/go/bin:$PATH"

          # 编译 apple 平台（iOS + macOS）
          go run ./cmd/internal/build_libbox -target apple

          echo "=== 编译产物 ==="
          ls -lh Libbox.xcframework/ 2>/dev/null || find . -name "*.xcframework" -type d

      - name: 检出 sing-box-for-apple 客户端源码
        run: |
          echo "=== 检出官方 sing-box-for-apple ==="
          git clone --depth 1 --recursive https://github.com/SagerNet/sing-box-for-apple.git
          cd sing-box-for-apple
          ls -la

      - name: 替换 Libbox.xcframework
        run: |
          echo "=== 替换为定制内核 ==="
          # 复制定制的 Libbox.xcframework 到客户端项目
          cp -R sing-box-custom/Libbox.xcframework sing-box-for-apple/
          ls -lh sing-box-for-apple/Libbox.xcframework/

      - name: 编译越狱版 SFI
        run: |
          echo "=== Xcode 编译越狱版 SFI ==="
          cd sing-box-for-apple
          export PATH="$HOME/go/bin:/opt/homebrew/bin:$PATH"

          # 运行官方越狱打包脚本
          bash Jailbreak/package.sh

          echo "=== 构建产物 ==="
          ls -lh build/jailbreak/*.deb 2>/dev/null || find build -name "*.deb"

      - name: 上传定制 deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFI-sb1mitm-iphoneos-arm64
          path: sing-box-for-apple/build/jailbreak/*.deb
          retention-days: 30

      - name: 上传 Libbox.xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Libbox-custom-xcframework
          path: sing-box-custom/Libbox.xcframework
          retention-days: 30
